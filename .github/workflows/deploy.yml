---
name: "Production deploy to shira.app"
on:
  push:
    branches:
    - "main"
jobs:
  deploy:
    runs-on: "ubuntu-latest"
    env:
      PRODUCTION_URL: "https://shira.app/"
      SPACE_URL: "https://space.shira.app"
      QUIZ_URL: "https://quiz.shira.app"
    steps:
    - uses: "actions/checkout@v7"
    - run: "npm install"
    - run: "npm run build"
    - uses: "burnett01/rsync-deployments@v9"
      with:
        switches: "-av --delete-after"
        path: "build/"
        remote_path: "/"
        remote_host: "tella-app.org"
        remote_port: 22
        remote_user: "shira--app"
        remote_key: "${{ secrets.PRIVATE_KEY }}"
